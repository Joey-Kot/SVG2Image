[package]
name = "svg2image"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A cross-platform CLI that converts SVG files to WebP, PNG, or JPEG images."

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
resvg = "0.48.1"
webp = { version = "0.3.1", default-features = false }

[patch.crates-io]
usvg = { path = "vendor/usvg" }

[dev-dependencies]
image = { version = "0.25.8", default-features = false, features = ["webp"] }
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
